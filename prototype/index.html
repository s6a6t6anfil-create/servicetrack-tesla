<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ServiceTrack Tesla · UI/UX</title><style>
:root{--ink:#172a36;--muted:#526575;--paper:#f3f5f7;--line:#d8e0e6;--accent:#006b60;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 16px;min-height:44px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e79419;outline-offset:2px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.tools{background:#e4eceb;padding:9px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.tools button{font-size:13px;padding:5px 12px;min-height:34px}header{background:var(--ink);color:white;padding:22px 32px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:23px;font-weight:750;letter-spacing:-.5px}.brand small{display:block;font-size:12px;letter-spacing:2px;color:#b4c5cc;font-weight:500}nav{display:flex;gap:8px;padding:18px 32px;border-bottom:1px solid var(--line);background:white}nav button[aria-current=page]{background:var(--accent);color:white}main{max-width:1140px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin:0 0 8px}h2{font-size:20px;margin:0 0 14px}p{margin:8px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.metric{font-size:28px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:16px 0}.row:last-child{border:0}.tag{display:inline-block;border-radius:30px;background:#e0f0eb;color:#07554c;padding:4px 12px;font-size:13px;font-weight:650}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-weight:600;font-size:14px}input,select,textarea{display:block;width:100%;margin-top:6px;border:1px solid #9eacb5;border-radius:7px;padding:11px;background:white;color:var(--ink)}textarea{min-height:100px}label.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.search{max-width:430px;margin:0}.notice{background:#e0f0eb;color:#07554c;padding:14px 20px;border-radius:8px;margin-bottom:20px}.empty{text-align:center;padding:40px}.login{max-width:470px;margin:35px auto}.flow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.flow button{border:2px solid var(--accent)}.wire{--accent:#333;--paper:#fff;--ink:#222;--muted:#555;--line:#777}.wire .panel,.wire button,.wire input,.wire select,.wire textarea,.wire .tag{border-radius:0;box-shadow:none}.wire header,.wire .tools,.wire .tag,.wire .notice{background:#eee;color:#222}.wire header small{color:#444}.wire .primary,.wire nav button[aria-current=page]{background:#ddd;color:#111}footer{padding:24px 32px;color:var(--muted);font-size:13px} @media(max-width:700px){header{padding:18px;align-items:flex-start}.brand{font-size:19px}header button{padding:8px}main{padding:20px 16px}nav{padding:12px 16px;overflow:auto}.grid,.fields{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}h1{font-size:26px}.row{align-items:flex-start;flex-wrap:wrap}.panel{padding:18px}.tools{padding:8px 16px}.login{margin:20px auto}}@media(prefers-reduced-motion:no-preference){main{animation:appear .15s ease-out}@keyframes appear{from{opacity:.5}to{opacity:1}}}
</style><div class="tools"><strong>UI/UX · прототип №16</strong><span>Вигадані дані · зміни до перезавантаження</span><button id="wire">Показати вайрфрейм</button><button id="design">Дизайн і сценарії</button></div><div id="app"></div><footer>ServiceTrack Tesla · незалежна майстерня · навчальний прототип</footer>
<script>
const names={received:'Прийнято',diagnosis:'Діагностика',approval:'Очікує погодження',parts:'Очікує запчастин',repair:'У ремонті',ready:'Готово',delivered:'Видано'};const next={received:['diagnosis'],diagnosis:['approval','parts','repair'],approval:['diagnosis','parts','repair'],parts:['diagnosis','repair'],repair:['diagnosis','parts','ready'],ready:['repair','delivered'],delivered:[]};let role=null,page='login',selected=1,message='';let customers=[{id:1,name:'Демо Олексій',phone:'+380000000001'}],vehicles=[{id:1,customer:1,model:'Model Y',vin:'TEST0000000000001',year:2023}],orders=[{id:1,vehicle:1,complaint:'Шум у передній підвісці',mechanic:'Максим',due:'2026-10-05',status:'diagnosis',diagnosis:'',items:[{name:'Первинний огляд',qty:1,price:800}],events:['Замовлення прийнято','Статус: Діагностика']}];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн';const total=o=>o.items.reduce((a,i)=>a+i.qty*i.price,0);const vehicle=o=>vehicles.find(v=>v.id===o.vehicle);const visible=()=>orders.filter(o=>role==='admin'||o.mechanic==='Максим');const field=(label,name,type='text',value='',required=true)=>`<label>${label}${required?' *':''}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;function go(p){page=p;message='';render();window.scrollTo(0,0)}function heading(t,sub,action=''){return `<div class="heading"><div><h1>${t}</h1><p class="muted">${sub}</p></div>${action}</div>`}const btn=(text,target,cls='')=>`<button class="${cls}" data-go="${target}">${text}</button>`;
function render(){const app=document.querySelector('#app');let body='';if(page==='login'){app.innerHTML=`<main><div class="login">${heading('Робота майстерні — в одному місці','Клієнти, ремонти та історія обслуговування Tesla.')}<form id="login" class="panel"><h2>Увійти в ServiceTrack</h2>${field('Логін','username','text','demo')}${field('Пароль','password','password','demonstration')}<label>Роль для демонстрації<select name="role"><option value="admin">Адміністратор · Олена</option><option value="mechanic">Механік · Максим</option></select></label><button class="primary" style="width:100%;margin-top:24px">Увійти</button><p class="muted">Це макет входу: введені дані нікуди не передаються. У готовій системі роль визначає обліковий запис.</p></form></div></main>`;bind();return}
if(page==='orders'){body=heading('Замовлення',role==='admin'?'Контролюйте строки та рух ремонтів.':'Ваші призначені ремонти.',role==='admin'?btn('+ Нове замовлення','neworder','primary'):'')+`<div class="grid"><div class="panel">На поточній сторінці<div class="metric">${visible().length}</div></div><div class="panel">У ремонті<div class="metric">${visible().filter(o=>o.status==='repair').length}</div></div><div class="panel">Готові до видачі<div class="metric">${visible().filter(o=>o.status==='ready').length}</div></div></div><div class="panel"><label>Пошук за клієнтом, VIN або номером<input id="search" class="search" placeholder="Наприклад, ST-0001"></label><div id="results">${orderRows(visible())}</div></div>`}
if(page==='customers')body=heading('Клієнти','Контактні дані та автомобілі.',role==='admin'?btn('+ Додати клієнта','newcustomer','primary'):'')+`<div class="panel">${customers.filter(c=>role==='admin'||vehicles.some(v=>v.customer===c.id&&visible().some(o=>o.vehicle===v.id))).map(c=>`<div class="row"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.phone)}</div></div>${btn('Автомобілі','vehicles')}</div>`).join('')||'<p>Поки немає доступних клієнтів.</p>'}</div>`;
if(page==='vehicles')body=heading('Автомобілі','Картка авто та історія звернень.',role==='admin'?btn('+ Додати автомобіль','newvehicle','primary'):'')+`<div class="panel">${vehicles.filter(v=>role==='admin'||visible().some(o=>o.vehicle===v.id)).map(v=>`<div class="row"><div><strong>${esc(v.model)} · ${v.year}</strong><div>${esc(customers.find(c=>c.id===v.customer).name)}</div><div class="muted">${esc(v.vin)}</div></div><button data-history="${v.id}">Історія авто</button></div>`).join('')}</div>`;
if(page==='newcustomer')body=heading('Новий клієнт','Обов’язкові поля позначено *.')+`<form id="customer" class="panel"><div class="fields">${field('Ім’я','name')}${field('Телефон','phone','tel')}${field('Email','email','email','',false)}</div><div class="actions"><button class="primary">Зберегти клієнта</button>${btn('Скасувати','customers')}</div></form>`;
if(page==='newvehicle')body=heading('Новий автомобіль','Спочатку створіть клієнта, потім додайте його авто.')+`<form id="vehicle" class="panel"><div class="fields"><label>Власник *<select name="customer">${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`)}</select></label><label>Модель *<select name="model">${['Model S','Model 3','Model X','Model Y','Cybertruck','Roadster'].map(m=>`<option>${m}</option>`)}</select></label>${field('Рік','year','number','2023')}${field('VIN, 17 символів без I/O/Q','vin')}</div><div class="actions"><button class="primary">Зберегти автомобіль</button>${btn('Скасувати','vehicles')}</div></form>`;
if(page==='neworder')body=heading('Нове замовлення','Зафіксуйте звернення та заплануйте роботу.')+`<form id="order" class="panel"><div class="fields"><label>Автомобіль *<select name="vehicle">${vehicles.map(v=>`<option value="${v.id}">${esc(v.model)} · ${esc(v.vin)}</option>`)}</select></label><label>Механік<select name="mechanic"><option>Максим</option><option>Не призначено</option></select></label>${field('Планова дата','due','date','2026-10-05')}<label class="full">Скарга / причина звернення *<textarea name="complaint" required maxlength="4000"></textarea></label></div><div class="actions"><button class="primary">Створити замовлення</button>${btn('Скасувати','orders')}</div></form>`;
if(page==='detail'){const o=orders.find(o=>o.id===selected),v=vehicle(o),closed=o.status==='delivered';body=heading('ST-'+String(o.id).padStart(4,'0'),esc(v.model)+' · '+esc(v.vin),btn('← До замовлень','orders'))+`<div class="panel"><div class="row"><span class="tag">${names[o.status]}</span><span>Строк: ${o.due} · ${esc(o.mechanic)}</span></div><p><b>Звернення:</b> ${esc(o.complaint)}</p>${closed?'<p class="notice">Замовлення видано. Редагування закрите; можна додати коментар.</p>':`<form id="diagnosis"><label>Діагностика<textarea name="diagnosis">${esc(o.diagnosis)}</textarea></label>${field('Коди несправностей (вручну)','fault_codes','text',o.fault_codes||'',false)}<div class="actions"><button>Зберегти діагностику</button></div></form><div class="actions">${next[o.status].filter(s=>role==='admin'||s!=='delivered').map(s=>`<button data-status="${s}" class="primary">${names[s]}</button>`).join('')}</div>`}</div><div class="panel"><h2>Кошторис</h2>${o.items.map(i=>`<div class="row"><span>${esc(i.name)} · ${i.qty} × ${money(i.price)}</span><strong>${money(i.qty*i.price)}</strong></div>`).join('')}<div class="row"><b>Разом</b><b>${money(total(o))}</b></div>${role==='admin'&&!closed?`<form id="item"><div class="fields">${field('Назва роботи / запчастини','name')}${field('Кількість','qty','number','1')}${field('Ціна, грн','price','number','0')}</div><button style="margin-top:16px">Додати позицію</button></form>`:''}</div><div class="panel"><h2>Історія та коментарі</h2>${o.events.map(e=>`<p>• ${esc(e)}</p>`).join('')}<form id="comment"><label>Новий коментар<textarea name="text" required maxlength="4000"></textarea></label><button style="margin-top:12px">Додати коментар</button></form></div>`}
if(page==='history')body=heading('Історія автомобіля','Усі доступні звернення для вибраного авто.',btn('← Автомобілі','vehicles'))+`<div class="panel">${orderRows(visible().filter(o=>o.vehicle===selected))}</div>`;
if(page==='design')body=heading('Дизайн і сценарії','ПЗ16 · схема переходів та правила інтерфейсу')+`<div class="panel"><h2>Шлях адміністратора</h2><div class="flow">${btn('Клієнти','customers')} → ${btn('Новий клієнт','newcustomer')} → ${btn('Автомобіль','newvehicle')} → ${btn('Замовлення','neworder')} → ${btn('Робочий список','orders')}</div><p>Відкрити картку → призначити роботи → діагностика → ремонт → готово → видача → історія авто.</p><h2>Шлях механіка</h2><p>Вхід як механік → свої замовлення → діагностика → дозволений статус → коментар. Керування клієнтами, кошторисом та видача приховані.</p></div><div class="panel"><h2>Дизайн-система</h2><p>Основний текст #172A36 · вторинний #526575 · дія #006B60 · фон #F3F5F7. Шрифт system-ui; основний текст16px, заголовок30px. Відступи8/16/24/32px. Кнопки від44px. Фокус позначений контуром; статус завжди має текстову назву.</p><p>До700px поля переходять в одну колонку. Помилки валідації пояснюють виправлення; успіх показується повідомленням. Кнопка «Показати вайрфрейм» прибирає колір і декоративні заокруглення, зберігаючи структуру кожного екрана.</p><p>Прототип демонструє логіку на локальних даних; це не підключений Back-end і не результати перевірки користувачами.</p></div>`;
app.innerHTML=`<header><div class="brand">ServiceTrack<small>TESLA WORKSHOP</small></div><div>${role==='admin'?'Олена · Адміністратор':'Максим · Механік'} <button id="logout">Вийти</button></div></header><nav>${['orders','customers','vehicles'].map((p,i)=>`<button data-go="${p}" ${page===p?'aria-current="page"':''}>${['Замовлення','Клієнти','Автомобілі'][i]}</button>`).join('')}</nav><main>${message?`<div class="notice" role="status">${esc(message)}</div>`:''}${body}</main>`;bind();}
function orderRows(os){return os.map(o=>`<div class="row"><div><strong>ST-${String(o.id).padStart(4,'0')} · ${esc(vehicle(o).model)}</strong><div class="muted">${esc(o.complaint)}</div></div><span class="tag">${names[o.status]}</span><strong>${money(total(o))}</strong><button data-order="${o.id}">Відкрити</button></div>`).join('')||'<div class="empty"><h2>Замовлень не знайдено</h2><p>Змініть запит пошуку або створіть нове замовлення.</p></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>{b.type='button';b.onclick=()=>go(b.dataset.go)});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{selected=+b.dataset.order;go('detail')});document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{selected=+b.dataset.history;go('history')});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const o=orders.find(o=>o.id===selected);o.status=b.dataset.status;o.events.push('Статус: '+names[o.status]);message='Статус оновлено';render()});const logout=document.querySelector('#logout');if(logout)logout.onclick=()=>{role=null;go('login')};const search=document.querySelector('#search');if(search)search.oninput=()=>{const q=search.value.toLowerCase();document.querySelector('#results').innerHTML=orderRows(visible().filter(o=>('ST-'+String(o.id).padStart(4,'0')+vehicle(o).vin+customers.find(c=>c.id===vehicle(o).customer).name).toLowerCase().includes(q)));document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{selected=+b.dataset.order;go('detail')})};document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(f.id==='login'){role=d.role;go('orders');return}if(f.id==='customer'){customers.push({id:customers.length+1,...d});page='customers'}if(f.id==='vehicle'){const vin=d.vin.trim().toUpperCase();if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)||vehicles.some(v=>v.vin===vin)||+d.year<2008||+d.year>2100){alert('Перевірте VIN: 17 символів без I/O/Q, без дублікатів; рік2008–2100.');return}vehicles.push({...d,id:vehicles.length+1,customer:+d.customer,vin,year:+d.year});page='vehicles'}if(f.id==='order'){selected=orders.length+1;orders.push({...d,id:selected,vehicle:+d.vehicle,status:'received',diagnosis:'',items:[],events:['Замовлення прийнято']});page='detail'}if(['diagnosis','item','comment'].includes(f.id)){const o=orders.find(o=>o.id===selected);if(f.id==='diagnosis'){o.diagnosis=d.diagnosis;o.fault_codes=d.fault_codes;}if(f.id==='item'){if(+d.qty<=0||+d.price<0){alert('Кількість має бути додатною, ціна — не від’ємною.');return}o.items.push({name:d.name,qty:+d.qty,price:+d.price})}if(f.id==='comment'){if(!d.text.trim())return;o.events.push((role==='admin'?'Олена':'Максим')+': '+d.text)}}message='Збережено у прототипі';render()});document.querySelectorAll('input[name=qty],input[name=price]').forEach(i=>{i.step='.01';i.min=i.name==='qty'?'.01':'0'})}
document.querySelector('#wire').onclick=e=>{document.body.classList.toggle('wire');e.target.textContent=document.body.classList.contains('wire')?'Показати оформлений макет':'Показати вайрфрейм'};document.querySelector('#design').onclick=()=>{if(!role)role='admin';go('design')};render();
</script></html>
