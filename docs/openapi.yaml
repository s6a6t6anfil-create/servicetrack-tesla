components:
  schemas:
    Comment:
      type: object
      properties:
        text:
          type: string
          maxLength: 4000
      required:
      - text
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - phone
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        text:
          type: string
          maxLength: 4000
        author_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_name
      - created_at
      - id
      - kind
      - text
    EventKindEnum:
      enum:
      - created
      - status
      - comment
      type: string
      description: |-
        * `created` - Створення
        * `status` - Статус
        * `comment` - Коментар
    Item:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        kind:
          $ref: '#/components/schemas/ItemKindEnum'
        name:
          type: string
          maxLength: 200
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - id
      - kind
      - name
      - order
      - quantity
      - unit_price
    ItemKindEnum:
      enum:
      - labor
      - part
      type: string
      description: |-
        * `labor` - Робота
        * `part` - Запчастина
    ModelEnum:
      enum:
      - Model S
      - Model 3
      - Model X
      - Model Y
      - Cybertruck
      - Roadster
      type: string
      description: |-
        * `Model S` - Model S
        * `Model 3` - Model 3
        * `Model X` - Model X
        * `Model Y` - Model Y
        * `Cybertruck` - Cybertruck
        * `Roadster` - Roadster
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        vehicle:
          type: integer
        vehicle_label:
          type: string
          readOnly: true
        vin:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        mechanic:
          type: integer
          nullable: true
        mechanic_name:
          type: string
          readOnly: true
          default: Не призначено
        complaint:
          type: string
          maxLength: 4000
        diagnosis:
          type: string
          maxLength: 8000
        fault_codes:
          type: string
          maxLength: 1000
        due_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          readOnly: true
        transitions:
          type: array
          items: {}
          readOnly: true
      required:
      - complaint
      - created_at
      - customer_name
      - due_date
      - id
      - items
      - mechanic_name
      - number
      - status
      - status_label
      - total
      - transitions
      - updated_at
      - vehicle
      - vehicle_label
      - vin
    PaginatedCustomerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    PaginatedEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    PaginatedItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    PaginatedOrderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    PaginatedVehicleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    PatchedCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        kind:
          $ref: '#/components/schemas/ItemKindEnum'
        name:
          type: string
          maxLength: 200
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    PatchedOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        vehicle:
          type: integer
        vehicle_label:
          type: string
          readOnly: true
        vin:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        mechanic:
          type: integer
          nullable: true
        mechanic_name:
          type: string
          readOnly: true
          default: Не призначено
        complaint:
          type: string
          maxLength: 4000
        diagnosis:
          type: string
          maxLength: 8000
        fault_codes:
          type: string
          maxLength: 1000
        due_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          readOnly: true
        transitions:
          type: array
          items: {}
          readOnly: true
    PatchedVehicle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        customer_name:
          type: string
          readOnly: true
        model:
          $ref: '#/components/schemas/ModelEnum'
        year:
          type: integer
          maximum: 2100
          minimum: 2008
        vin:
          type: string
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
          maxLength: 17
        plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 3000000
          minimum: 0
    SessionInfo:
      type: object
      properties:
        username:
          type: string
        manager:
          type: boolean
        mechanics:
          type: array
          items:
            type: object
            additionalProperties: {}
        statuses:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - manager
      - mechanics
      - statuses
      - username
    Status:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    StatusEnum:
      enum:
      - received
      - diagnosis
      - approval
      - parts
      - repair
      - ready
      - delivered
      type: string
      description: |-
        * `received` - Прийнято
        * `diagnosis` - Діагностика
        * `approval` - Очікує погодження
        * `parts` - Очікує запчастин
        * `repair` - У ремонті
        * `ready` - Готово
        * `delivered` - Видано
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        customer_name:
          type: string
          readOnly: true
        model:
          $ref: '#/components/schemas/ModelEnum'
        year:
          type: integer
          maximum: 2100
          minimum: 2008
        vin:
          type: string
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
          maxLength: 17
        plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 3000000
          minimum: 0
      required:
      - customer
      - customer_name
      - id
      - model
      - vin
      - year
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
