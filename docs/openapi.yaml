          minimum: 2008
        vin:
          type: string
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
          maxLength: 17
        plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 3000000
          minimum: 0
      required:
      - customer
      - customer_name
      - id
      - model
      - vin
      - year
