          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          readOnly: true
        transitions:
          type: array
          items: {}
          readOnly: true
    PatchedVehicle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        customer_name:
          type: string
          readOnly: true
        model:
          $ref: '#/components/schemas/ModelEnum'
        year:
          type: integer
          maximum: 2100
          minimum: 2008
        vin:
          type: string
          pattern: ^[A-HJ-NPR-Z0-9]{17}$
          maxLength: 17
        plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 3000000
          minimum: 0
    SessionInfo:
      type: object
      properties:
        username:
          type: string
        manager:
          type: boolean
        mechanics:
          type: array
          items:
            type: object
            additionalProperties: {}
        statuses:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - manager
      - mechanics
      - statuses
      - username
    Status:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    StatusEnum:
      enum:
      - received
      - diagnosis
      - approval
      - parts
      - repair
      - ready
      - delivered
      type: string
      description: |-
        * `received` - Прийнято
        * `diagnosis` - Діагностика
        * `approval` - Очікує погодження
        * `parts` - Очікує запчастин
        * `repair` - У ремонті
        * `ready` - Готово
        * `delivered` - Видано
    Vehicle:
