          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        kind:
          $ref: '#/components/schemas/ItemKindEnum'
        name:
          type: string
          maxLength: 200
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    PatchedOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        vehicle:
          type: integer
        vehicle_label:
          type: string
          readOnly: true
        vin:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        mechanic:
          type: integer
          nullable: true
        mechanic_name:
          type: string
          readOnly: true
          default: Не призначено
        complaint:
          type: string
          maxLength: 4000
        diagnosis:
          type: string
          maxLength: 8000
        fault_codes:
          type: string
          maxLength: 1000
        due_date:
          type: string
          format: date
