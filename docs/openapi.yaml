openapi: 3.0.3
info:
  title: ServiceTrack Tesla API
  version: 0.1.0
  description: API для однієї незалежної майстерні Tesla. Сесійна автентифікація та
    CSRF.
paths:
  /api/customers/:
    get:
      operationId: customers_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerList'
              example:
                count: 1
                next: null
                previous: null
                results:
                - id: 1
                  name: Демо клієнт
                  phone: '+380000000001'
                  email: demo@example.invalid
                  notes: ''
                  created_at: '2026-09-29T13:33:27.005687+03:00'
          description: Успішна відповідь, приклад із ізольованої демонстраційної БД.
        '400':
          description: Некоректні поля, фільтр або бізнес-правило.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Помилки полів або detail; текст локалізований.
        '403':
          description: Немає сесії, прав або коректного CSRF.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Помилки полів або detail; текст локалізований.
        '404':
          description: Об’єкт або сторінка не знайдені / недоступні.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Помилки полів або detail; текст локалізований.
        '405':
          description: Метод не підтримується.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Помилки полів або detail; текст локалізований.
        '406':
          description: Непідтримуваний Accept.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Помилки полів або detail; текст локалізований.
        '429':
          description: Перевищено 600 запитів за хвилину для користувача; Retry-After.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Помилки полів або detail; текст локалізований.
        '500':
          description: Неочікувана помилка сервера; формат залежить від DEBUG і сервера.
      description: Потрібна сесія. Механік читає лише призначені йому замовлення та
        пов’язані записи. Зміни customers/vehicles/items доступні лише адміністратору.
